# JVM tests run on H2 in memory (the H2 driver is test-scoped), in PostgreSQL mode
# for the native "insert ... on conflict do nothing" of the order payment locks.
spring:
  datasource:
    url: jdbc:h2:mem:payment-test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;DATABASE_TO_LOWER=TRUE;MODE=PostgreSQL
    username: sa
    password: ""

payment:
  service-token: test-service-token
  webhook-secret: test-webhook-secret
  settlement-delay: PT10S
  three-ds-timeout: PT15M
  # Scheduled jobs are driven explicitly by the tests.
  settlement:
    enabled: false
  notifications:
    retry-enabled: false
  events:
    enabled: false
